# ---------------------------------------------------------------------------
# nginx reverse proxy for the Recraft Stock Generator — aaPanel
#
# Two ways to use this:
#
# (A) SUB-PATH (default, recommended — no extra DNS needed)
#     Put the app under https://your-domain.com/recraft
#     1. Set RECRAFT_ROOT_PATH=/recraft in /www/wwwroot/recraft/.env
#     2. Paste the `location /recraft/` block below into your aaPanel site's
#        nginx config (Website -> your site -> Config File).
#     3. Reload nginx.
#
# (B) SUBDOMAIN (cleaner URLs, e.g. https://recraft.your-domain.com)
#     1. Point that subdomain's A record at the server IP.
#     2. In aaPanel: Website -> Add Site -> create the site (PHP version
#        "Pure static" is fine), open its Config File and paste the WHOLE
#        block below, then set RECRAFT_ROOT_PATH= (empty) in .env.
#     3. Reload nginx.
#
# Why these settings matter for Gradio:
#   * proxy_buffering off + long timeouts — SSE live log / progress streaming
#     is blocked (and looks frozen) when nginx buffers the response.
#   * client_max_body_size — your CSV and the generated 4096x4096 JPEGs are
#     large; the 250m default silently truncates uploads.
#   * X-Forwarded-Proto — Gradio needs it to build correct https:// URLs.
# ---------------------------------------------------------------------------

# client_max_body_size is http/server level, so put it in the SERVER block,
# not inside location{}. If you prefer to keep it local, use
# `client_max_body_size 250m;` inside each location instead.
#
# WebSocket support for Gradio's event stream. `map` is only allowed at the
# http{} level, so this snippet must go in nginx's main config
# (/www/server/nginx/conf/nginx.conf), inside the http{} block — NOT in the
# aaPanel site config. Skip it if your nginx already defines it.
#
#   map $http_upgrade $recraft_connection {
#       default upgrade;
#       ''      close;
#   }
#
# The location blocks below use that variable. If you do not add the map,
# replace `$recraft_connection` with `upgrade` (works for Gradio; slightly
# less correct for plain HTTP requests).

upstream recraft_app {
    server 127.0.0.1:7860;
    keepalive 32;
}

server {
    listen 80;
    server_name recraft.example.com;   # <-- your subdomain (option B)

    # Only needed so the ACME/Let's Encrypt renewal redirect works before
    # the certificate exists.
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/recraft.acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name recraft.example.com;   # <-- your subdomain (option B)

    # aaPanel manages these paths for you; keep its values.
    ssl_certificate     /www/server/panel/vhost/cert/recraft.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/recraft.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gradio serves large JPEGs; do not let nginx cap the response.
    client_max_body_size 250m;
    proxy_buffer_size     64k;
    proxy_buffers         8 64k;
    proxy_busy_buffers_size 128k;

    access_log /www/wwwlogs/recraft.log;
    error_log  /www/wwwlogs/recraft.error.log;

    # ---- (A) SUB-PATH VARIANT -------------------------------------------
    # Paste ONLY this location block into an existing site, and set
    # RECRAFT_ROOT_PATH=/recraft in .env.
    location /recraft/ {
        proxy_pass http://recraft_app/recraft/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $recraft_connection;

        # SSE / long-poll progress: never buffer, never time out early.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Redirect /recraft (no trailing slash) to the slash form.
        rewrite ^/recraft$ /recraft/ permanent;
    }

    # ---- (B) FULL SUBDOMAIN VARIANT -------------------------------------
    # For option B delete the location block above and uncomment this one.
    #
    # location / {
    #     proxy_pass http://recraft_app/;
    #     proxy_http_version 1.1;
    #
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Host  $host;
    #     proxy_set_header Upgrade           $http_upgrade;
    #     proxy_set_header Connection        $recraft_connection;
    #
    #     proxy_buffering    off;
    #     proxy_cache        off;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    # }
}
